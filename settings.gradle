pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'IrisCore'

// IrisVision is a separately cloned companion project. Include it for local
// development when it is available, but keep IrisCore independently buildable
// in a fresh GitHub Actions checkout.
def irisVisionDirectory = file('../IrisVision')
if (irisVisionDirectory.isDirectory()) {
    include(':irisVision')
    project(':irisVision').projectDir = irisVisionDirectory
}
